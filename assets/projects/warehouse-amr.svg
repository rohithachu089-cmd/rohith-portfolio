<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Warehouse Aisle Perspective Background -->
  <rect width="600" height="340" fill="#111318"/>
  <!-- Perspective Shelves -->
  <path d="M0 0 L180 140 V240 L0 340 Z" fill="#1C2029" stroke="#2D3444" stroke-width="2"/>
  <path d="M600 0 L420 140 V240 L600 340 Z" fill="#1C2029" stroke="#2D3444" stroke-width="2"/>
  <!-- Floor Perspective Grid -->
  <path d="M180 240 L0 340 M260 240 L150 340 M340 240 L450 340 M420 240 L600 340" stroke="#00E5FF" stroke-width="1" opacity="0.4"/>
  <!-- Sleek Blue Circular Warehouse AMR -->
  <g transform="translate(300, 240)">
    <ellipse cx="0" cy="0" rx="100" ry="40" fill="#0D1626" stroke="#00E5FF" stroke-width="3"/>
    <ellipse cx="0" cy="-6" rx="85" ry="32" fill="#1A273D" stroke="#00E5FF" stroke-width="1.5"/>
    <ellipse cx="0" cy="-6" rx="50" ry="18" fill="#0D1626"/>
    <!-- LiDAR Light Ring -->
    <ellipse cx="0" cy="-6" rx="30" ry="10" fill="#00E5FF" opacity="0.8"/>
  </g>
  <text x="30" y="310" fill="#E0E0E0" font-family="sans-serif" font-size="12" font-weight="bold">AUTONOMOUS MOBILE ROBOT (AMR) FOR WAREHOUSE</text>
</svg>
