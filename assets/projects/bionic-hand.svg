<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="340" fill="#080808"/>
  <!-- Metallic Bionic Hand Illustration -->
  <g opacity="0.95">
    <!-- Wrist Base -->
    <rect x="70" y="150" width="100" height="70" rx="8" fill="#1A1818" stroke="#FF3B30" stroke-width="2"/>
    <rect x="90" y="165" width="60" height="40" rx="4" fill="#111" stroke="#333" stroke-width="1"/>
    <circle cx="120" cy="185" r="8" fill="#FF3B30"/>
    
    <!-- Palm Structure -->
    <path d="M170 140 L280 130 L320 220 L170 230 Z" fill="#222" stroke="#444" stroke-width="2"/>
    <circle cx="230" cy="175" r="16" fill="#111" stroke="#FF3B30" stroke-width="1.5"/>
    <circle cx="230" cy="175" r="6" fill="#FF3B30"/>

    <!-- Fingers -->
    <!-- Thumb -->
    <path d="M200 135 L230 90 L260 70" stroke="#888" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M200 135 L230 90 L260 70" stroke="#FF3B30" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Index -->
    <path d="M280 130 L350 100 L420 80 L480 70" stroke="#AAAAAA" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="350" cy="100" r="7" fill="#111" stroke="#FF3B30" stroke-width="2"/>
    <circle cx="420" cy="80" r="6" fill="#111" stroke="#FF3B30" stroke-width="2"/>

    <!-- Middle -->
    <path d="M295 150 L370 130 L450 115 L520 105" stroke="#CCCCCC" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="370" cy="130" r="7" fill="#111" stroke="#FF3B30" stroke-width="2"/>
    <circle cx="450" cy="115" r="6" fill="#111" stroke="#FF3B30" stroke-width="2"/>

    <!-- Ring -->
    <path d="M305 175 L375 165 L440 155 L500 150" stroke="#AAAAAA" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="375" cy="165" r="6" fill="#111" stroke="#FF3B30" stroke-width="1.5"/>

    <!-- Pinky -->
    <path d="M315 200 L370 200 L420 200 L470 200" stroke="#888888" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="370" cy="200" r="5" fill="#111" stroke="#FF3B30" stroke-width="1.5"/>
  </g>
  <!-- Red Glow Accent -->
  <circle cx="500" cy="100" r="100" fill="#FF3B30" opacity="0.15" filter="blur(40px)"/>
  <text x="30" y="310" fill="#B5B5B5" font-family="sans-serif" font-size="12" font-weight="bold">MYOELECTRIC PROSTHETIC HAND</text>
</svg>
