<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Agricultural Field Background -->
  <rect width="600" height="340" fill="#1C2E19"/>
  <!-- Field Crop Rows -->
  <path d="M0 200 L600 160 M0 240 L600 210 M0 280 L600 260 M0 320 L600 310" stroke="#2D4A27" stroke-width="12"/>
  <path d="M0 180 L600 140 M0 220 L600 190 M0 260 L600 240 M0 300 L600 290" stroke="#3E6334" stroke-width="8"/>
  <!-- Rover Body -->
  <g opacity="0.95">
    <rect x="180" y="110" width="240" height="110" rx="10" fill="#151A14" stroke="#FF3B30" stroke-width="2.5"/>
    <!-- Wheels -->
    <rect x="140" y="95" width="40" height="55" rx="6" fill="#0A0D09" stroke="#555" stroke-width="2"/>
    <rect x="420" y="95" width="40" height="55" rx="6" fill="#0A0D09" stroke="#555" stroke-width="2"/>
    <rect x="140" y="180" width="40" height="55" rx="6" fill="#0A0D09" stroke="#555" stroke-width="2"/>
    <rect x="420" y="180" width="40" height="55" rx="6" fill="#0A0D09" stroke="#555" stroke-width="2"/>
    <!-- Camera Sensor Tower -->
    <rect x="270" y="130" width="60" height="40" rx="4" fill="#000" stroke="#FF3B30" stroke-width="1.5"/>
    <circle cx="300" cy="150" r="12" fill="#111" stroke="#00E5FF" stroke-width="2"/>
    <circle cx="300" cy="150" r="4" fill="#00E5FF"/>
    <!-- Spraying Nozzle Cone -->
    <path d="M300 170 L260 210 M300 170 L340 210" stroke="#FF3B30" stroke-width="2" stroke-dasharray="3 3"/>
  </g>
  <text x="30" y="310" fill="#E0E0E0" font-family="sans-serif" font-size="12" font-weight="bold">AGROX — SMART PESTICIDE SPRAYING ROVER</text>
</svg>
