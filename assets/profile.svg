<svg width="450" height="550" viewBox="0 0 450 550" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Frameless Silhouette with Red Backlight & Rim Light -->
  <defs>
    <radialGradient id="redGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF3B30" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#FF3B30" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Red Aura Backlight Glow (No Frame) -->
  <circle cx="225" cy="220" r="180" fill="url(#redGlow)"/>

  <!-- Head & Hair Silhouette -->
  <path d="M225 110 C180 110, 165 145, 165 185 C165 220, 185 250, 225 250 C265 250, 285 220, 285 185 C285 145, 270 110, 225 110 Z" fill="#141010" stroke="#FF3B30" stroke-width="2.5"/>
  <path d="M170 155 C160 135, 180 100, 225 95 C270 100, 290 135, 280 155 C275 125, 250 110, 225 110 C200 110, 175 125, 170 155 Z" fill="#FF3B30" opacity="0.8"/>

  <!-- Hoodie / Shoulders Cutout (Frameless Base) -->
  <path d="M120 480 C120 330, 160 270, 225 270 C290 270, 330 330, 330 480 Z" fill="#1D1818" stroke="#FF3B30" stroke-width="3"/>
  <path d="M125 480 C130 350, 165 275, 225 275 C285 275, 320 350, 325 480 Z" stroke="#FF4D4D" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Hoodie Strings -->
  <path d="M210 280 L210 380" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <path d="M240 280 L240 375" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Text Hint at Bottom (Subtle, Frameless) -->
